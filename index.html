<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静角 · 一个让你安静下来的地方</title>
<style>
  :root {
    --bg-deep: #0d1420;
    --bg-mid: #16202f;
    --ink: #dce4ee;
    --ink-dim: #7d8a9c;
    --warm: #e3b284;
    --warm-dim: #a98c6b;
    --line: rgba(220, 228, 238, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 60%, #1b2736 100%);
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 慢慢浮现的星尘 */
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(220,228,238,.35) 50%, transparent 50%),
      radial-gradient(1px 1px at 70% 20%, rgba(220,228,238,.25) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(227,178,132,.30) 50%, transparent 50%),
      radial-gradient(1px 1px at 85% 60%, rgba(220,228,238,.20) 50%, transparent 50%),
      radial-gradient(1px 1px at 10% 80%, rgba(220,228,238,.18) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 60% 85%, rgba(227,178,132,.22) 50%, transparent 50%);
    animation: drift 120s linear infinite alternate;
  }
  @keyframes drift { from { transform: translate(0,0);} to { transform: translate(-30px, 20px);} }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 2.2em;
    padding: 26px 20px 0;
    z-index: 10;
  }
  header button {
    background: none; border: none; cursor: pointer;
    font-size: 15px; letter-spacing: .35em; padding: 6px 2px;
    color: var(--ink-dim);
    font-family: "SimSun", "Songti SC", serif;
    transition: color .8s;
  }
  header button.active { color: var(--warm); }
  header button:hover { color: var(--ink); }

  main { height: 100%; position: relative; }
  section {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 70px 24px 40px;
    animation: sectionIn 1.4s ease;
  }
  section.show { display: flex; }
  @keyframes sectionIn { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none;} }

  .hint { color: var(--ink-dim); font-size: 13px; letter-spacing: .2em; }
  .serif { font-family: "SimSun", "Songti SC", serif; }

  /* ---------- 呼吸 ---------- */
  .breath-stage { position: relative; width: 320px; height: 320px; display: grid; place-items: center; }
  .breath-ring {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    border: 1px solid var(--line);
  }
  .breath-ring::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    border: 1px dashed rgba(227,178,132,.18);
  }
  .breath-orb {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(227,178,132,.75), rgba(227,178,132,.18) 55%, rgba(227,178,132,.05) 75%);
    box-shadow: 0 0 60px rgba(227,178,132,.25), 0 0 120px rgba(227,178,132,.10);
    transform: scale(.62);
    transition: transform 4s cubic-bezier(.4,0,.4,1);
  }
  .breath-label {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    font-size: 20px; letter-spacing: .5em; text-indent: .5em;
    color: var(--ink);
  }
  .breath-count {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 13px; color: var(--ink-dim); letter-spacing: .1em;
    mix-blend-mode: screen;
  }
  .breath-meta { margin-top: 64px; display: flex; align-items: center; gap: 26px; }
  .breath-meta button, .mode-btn {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink-dim); font-size: 13px; letter-spacing: .25em; text-indent: .25em;
    padding: 9px 22px; cursor: pointer; transition: all .6s;
    font-family: inherit;
  }
  .breath-meta button:hover, .mode-btn:hover { border-color: rgba(227,178,132,.4); color: var(--warm); }
  .breath-meta button.on { color: var(--warm); border-color: rgba(227,178,132,.4); }
  #cycleDone { font-size: 12px; color: var(--ink-dim); letter-spacing: .15em; min-width: 90px; }

  /* ---------- 放下 ---------- */
  .put-box { width: min(520px, 88vw); text-align: center; }
  .put-box h2 { font-size: 17px; font-weight: normal; letter-spacing: .3em; color: var(--ink); margin-bottom: 26px; }
  textarea {
    width: 100%; height: 86px; resize: none;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font-size: 15px; line-height: 1.9; padding: 16px;
    font-family: inherit; outline: none; transition: border-color .6s;
    -webkit-user-select: text; user-select: text;
  }
  textarea:focus { border-color: rgba(227,178,132,.35); }
  textarea::placeholder { color: #5a6577; }
  .put-actions { margin-top: 18px; }
  .put-note { margin-top: 34px; font-size: 13px; color: var(--ink-dim); letter-spacing: .15em; min-height: 20px; transition: opacity 1.2s; }
  /* ---------- 放下：记忆沙滩 ---------- */
  #put { justify-content: flex-start; }
  .put-box h2 { margin-bottom: 16px; }
  .put-note { margin-top: 18px; }
  .past-entry { margin-top: 12px; }
  .drift {
    position: fixed; z-index: 15; pointer-events: none;
    color: rgba(220,228,238,.92); font-size: 19px; letter-spacing: .12em;
    max-width: 60vw; text-align: center; line-height: 1.7;
    text-shadow: 0 0 14px rgba(220,228,238,.25);
    will-change: transform, opacity;
  }
  .beach {
    position: relative; flex: 1; width: 100%; min-height: 240px;
    margin-top: 4px; overflow: hidden; cursor: pointer;
    touch-action: manipulation;
  }
  .beach-sand {
    position: absolute; left: -12%; right: -12%; bottom: 0; height: 74%; z-index: 1;
    background:
      radial-gradient(1px 1px at 28% 62%, rgba(220,228,238,.15) 50%, transparent 50%),
      radial-gradient(1px 1px at 66% 44%, rgba(220,228,238,.10) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 50% 78%, rgba(220,228,238,.09) 50%, transparent 50%),
      radial-gradient(1px 1px at 82% 66%, rgba(220,228,238,.10) 50%, transparent 50%),
      linear-gradient(to top, rgba(25,31,41,.95), rgba(23,29,39,.55) 55%, transparent);
    border-radius: 100% 100% 0 0 / 30% 30% 0 0;
  }
  #beachWritings { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .sand-word {
    position: absolute; font-size: 13px; letter-spacing: .16em; line-height: 1.9;
    color: rgba(220,228,238,.62); max-width: 46%; text-align: center;
    text-shadow: 0 1px 2px rgba(10,15,24,.85);
    transform: rotate(var(--rot, 0deg));
    transition: opacity 2.8s ease, filter 2.8s ease, transform 2.8s ease;
  }
  .sand-word.demo { font-size: 16px; max-width: none; white-space: nowrap; color: rgba(220,228,238,.7); }
  .wave {
    position: absolute; left: -30%; width: 160%; bottom: -2%; pointer-events: none;
    background: linear-gradient(to top, rgba(96,126,166,.20), rgba(96,126,166,.07) 65%, transparent);
    border-radius: 46% 54% 0 0 / 90% 75% 0 0;
    transition: height 2.5s ease;
  }
  .wave::before {
    content: ""; position: absolute; top: -2px; left: 8%; right: 8%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(220,228,238,.32), transparent);
    border-radius: 50%; filter: blur(1.5px);
  }
  .w-back { height: 34%; z-index: 3; animation: waveBack 13s ease-in-out infinite alternate; }
  .w-front { height: 27%; z-index: 4; animation: waveFront 9s ease-in-out infinite alternate; animation-delay: -4s; }
  @keyframes waveBack { from { transform: translate(-2.5%, 9%); } to { transform: translate(2.5%, -6%); } }
  @keyframes waveFront { from { transform: translate(3%, 8%); } to { transform: translate(-3%, -10%); } }
  .beach.surge .w-front { animation-duration: 2s; height: 40%; }
  .beach.surge .w-back { animation-duration: 2.9s; height: 46%; }
  .beach-hint {
    position: absolute; top: 10px; right: 14px; z-index: 5;
    font-size: 11px; color: #4d5768; letter-spacing: .18em;
    pointer-events: none;
  }
  .past-entry {
    margin-top: 26px; background: none; border: none; cursor: pointer;
    color: #4d5768; font-size: 12px; letter-spacing: .5em; text-indent: .5em;
    transition: color .8s; font-family: "SimSun", "Songti SC", serif;
  }
  .past-entry:hover { color: var(--ink-dim); }
  .veil {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(9,13,20,.74); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .veil.show { display: flex; animation: sectionIn .9s ease; }
  .past-panel {
    width: min(480px, 90vw); max-height: 76vh; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #121b28, #0e1520);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 30px 26px 22px;
  }
  .past-panel h3 { font-size: 16px; font-weight: normal; letter-spacing: .3em; text-indent: .3em; text-align: center; color: var(--ink); }
  .past-sub { text-align: center; font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; line-height: 1.8; margin: 12px 0 16px; }
  .past-list { overflow-y: auto; flex: 1; padding: 4px 2px; }
  .past-item { padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .past-item:last-child { border-bottom: none; }
  .past-date { font-size: 11px; color: var(--warm-dim); letter-spacing: .15em; margin-bottom: 6px; }
  .past-text { font-size: 14px; line-height: 1.9; color: var(--ink); word-break: break-all; }
  .past-empty { text-align: center; color: var(--ink-dim); font-size: 13px; letter-spacing: .15em; line-height: 2.2; padding: 28px 0; }
  #pastClose { margin-top: 18px; align-self: center; }

  /* ---------- 静坐 ---------- */
  .sit-time { font-size: 88px; font-weight: 200; letter-spacing: .06em; color: var(--ink); }
  .sit-time small { font-size: 24px; color: var(--ink-dim); }
  .sit-dot {
    width: 64px; height: 64px; border-radius: 50%; margin: 40px auto 0;
    background: radial-gradient(circle at 38% 32%, rgba(227,178,132,.7), rgba(227,178,132,.16) 55%, rgba(227,178,132,.04) 75%);
    box-shadow: 0 0 44px rgba(227,178,132,.22), 0 0 100px rgba(227,178,132,.09);
    animation: sitPulse 8s ease-in-out infinite;
  }
  @keyframes sitPulse { 0%,100% { opacity:.45; transform: scale(.82);} 50% { opacity:.95; transform: scale(1.18);} }
  .sit-presets { margin-top: 48px; display: flex; gap: 16px; }
  .sit-msg { margin-top: 30px; font-size: 14px; color: var(--warm); letter-spacing: .2em; min-height: 20px; opacity: 0; transition: opacity 2s; }
  .sit-msg.show { opacity: 1; }

  footer {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #4d5768; letter-spacing: .3em; z-index: 1;
  }
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d1420'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23e3b284' stroke-opacity='.35'/%3E%3Ctext x='50' y='56' font-family='serif' font-size='48' fill='%23f0d0b8' text-anchor='middle'%3E静%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="stars"></div>

<header>
  <button data-mode="breath" class="active serif">呼吸</button>
  <button data-mode="put" class="serif">放下</button>
  <button data-mode="sit" class="serif">静坐</button>
</header>

<main>
  <!-- 呼吸 -->
  <section id="breath" class="show">
    <div class="breath-stage">
      <div class="breath-ring"></div>
      <div class="breath-orb" id="orb"></div>
      <div class="breath-count" id="breathCount"></div>
      <div class="breath-label serif" id="breathLabel">准备好了吗</div>
    </div>
    <div class="breath-meta">
      <button id="breathBtn" class="on">停 止</button>
      <span id="cycleDone"></span>
      <button id="soundBtn" title="微弱的环境声与提示音">声 音 关</button>
      <button id="soundKind" title="切换环境音：风 · 雨 · 颂钵 · 琴">· 风 ·</button>
    </div>
    <p class="hint" style="margin-top:26px">四秒吸入 · 四秒停住 · 六秒呼出 · 呼吸会自己找到节奏</p>
  </section>

  <!-- 放下 -->
  <section id="put">
    <div class="put-box">
      <h2 class="serif">那件让你烦的事，写下来</h2>
      <textarea id="worryText" placeholder="不用写得有条理，乱七八糟也行……" spellcheck="false"></textarea>
      <div class="put-actions">
        <button class="mode-btn" id="putBtn">放 下 它</button>
      </div>
      <p class="put-note" id="putNote"></p>
      <button class="past-entry" id="pastBtn">往 事</button>
    </div>
    <div class="beach" id="beach" title="长按沙滩，看浪如何抚平字迹">
      <div class="beach-sand"></div>
      <div id="beachWritings"></div>
      <div class="wave w-back"></div>
      <div class="wave w-front"></div>
      <p class="beach-hint">长按沙滩 · 看浪如何抚平字迹</p>
    </div>
  </section>

  <!-- 静坐 -->
  <section id="sit">
    <div class="sit-time serif" id="sitTime">5<small> 分钟</small></div>
    <div class="sit-dot"></div>
    <p class="sit-msg" id="sitMsg"></p>
    <div class="sit-presets">
      <button class="mode-btn" data-min="3">三 分钟</button>
      <button class="mode-btn" data-min="5">五 分钟</button>
      <button class="mode-btn" data-min="10">十 分钟</button>
      <button class="mode-btn" id="sitStart">开 始</button>
    </div>
    <p class="hint" style="margin-top:26px">什么都不用做 · 眼睛可以闭上 · 结束时会有轻轻一声钟</p>
  </section>
</main>

<!-- 往事 -->
<div class="veil" id="pastVeil">
  <div class="past-panel">
    <h3>那些已经飘走的事</h3>
    <p class="past-sub">它们曾落在沙滩上，被浪一遍遍抚平。<br>这里的字，替你把日期留住。</p>
    <div class="past-list" id="pastList"></div>
    <button class="mode-btn" id="pastClose">合 上</button>
  </div>
</div>

<footer>静 角 · 造 于 一 个 九 月 的 晚 上</footer>

<script>
(function () {
  "use strict";

  /* ---------- 模式切换 ---------- */
  var sections = { breath: document.getElementById("breath"),
                   put: document.getElementById("put"),
                   sit: document.getElementById("sit") };
  Array.prototype.forEach.call(document.querySelectorAll("header button"), function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll("header button"), function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      Object.keys(sections).forEach(function (k) { sections[k].classList.toggle("show", k === b.dataset.mode); });
      if (b.dataset.mode === "sit") resetSit();
      if (b.dataset.mode === "put") renderBeach();
    });
  });

  /* ---------- 声音（全部本地生成，无外部文件） ---------- */
  var AC = null, soundOn = false, ambientKind = "wind", ambient = null;
  var KINDS = ["wind", "rain", "bowl", "qin"];
  var KIND_NAMES = { wind: "风", rain: "雨", bowl: "钵", qin: "琴" };
  function ensureAC() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    return AC;
  }
  function chime(freq) {
    if (!soundOn) return;
    var ac = ensureAC(), t = ac.currentTime;
    [[freq || 528, 0.09], [(freq || 528) * 2, 0.028]].forEach(function (p) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = p[0];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(p[1], t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 2.4);
    });
  }
  function makeNoiseBuffer(ac) {
    var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    return buf;
  }
  function stopAmbient() {
    if (!ambient) return;
    var a = ambient; ambient = null;
    try {
      a.g.gain.cancelScheduledValues(AC.currentTime);
      a.g.gain.setValueAtTime(a.g.gain.value, AC.currentTime);
      a.g.gain.linearRampToValueAtTime(0, AC.currentTime + 1);
    } catch (e) {}
    setTimeout(function () {
      a.stops.forEach(function (s) { try { s.stop(); } catch (e) {} });
      if (a.timers) a.timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
    }, 1200);
  }
  function startAmbient() {
    var ac = ensureAC();
    stopAmbient();
    var master = ac.createGain(); master.gain.value = 0;
    master.connect(ac.destination);
    var stops = [], timers = [];
    if (ambientKind === "wind") {
      var ws = ac.createBufferSource(); ws.buffer = makeNoiseBuffer(ac); ws.loop = true;
      var wf = ac.createBiquadFilter(); wf.type = "lowpass"; wf.frequency.value = 320;
      ws.connect(wf).connect(master); ws.start(); stops.push(ws);
      master.gain.linearRampToValueAtTime(0.05, ac.currentTime + 3);
    } else if (ambientKind === "rain") {
      var nbuf = makeNoiseBuffer(ac);
      var rs = ac.createBufferSource(); rs.buffer = nbuf; rs.loop = true; rs.playbackRate.value = 1.6;
      var hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
      var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000;
      rs.connect(hp).connect(lp).connect(master); rs.start(); stops.push(rs);
      master.gain.linearRampToValueAtTime(0.04, ac.currentTime + 2);
      timers.push(setInterval(function () {
        for (var k = 0; k < 3; k++) setTimeout(function () {
          var t = ac.currentTime;
          var ds = ac.createBufferSource(); ds.buffer = nbuf;
          var bf = ac.createBiquadFilter(); bf.type = "bandpass"; bf.frequency.value = 2000 + Math.random() * 4000; bf.Q.value = 9;
          var g = ac.createGain();
          g.gain.setValueAtTime(0.04 + Math.random() * 0.03, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
          ds.connect(bf).connect(g).connect(ac.destination);
          ds.start(t); ds.stop(t + 0.15);
        }, Math.random() * 400);
      }, 500));
    } else if (ambientKind === "bowl") {
      [[110, .5], [165, .3], [220, .22], [330, .1], [550, .04]].forEach(function (p) {
        var o = ac.createOscillator(); o.type = "sine";
        o.frequency.value = p[0] * (1 + (Math.random() - .5) * 0.002);
        var g = ac.createGain(); g.gain.value = p[1];
        o.connect(g).connect(master); o.start(); stops.push(o);
      });
      var lfo = ac.createOscillator(); lfo.frequency.value = 0.08;
      var lg = ac.createGain(); lg.gain.value = 0.01;
      lfo.connect(lg).connect(master.gain); lfo.start(); stops.push(lfo);
      master.gain.linearRampToValueAtTime(0.035, ac.currentTime + 4);
    } else if (ambientKind === "qin") {
      var scale = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33];
      var pad = ac.createOscillator(); pad.type = "sine"; pad.frequency.value = 130.81;
      var padG = ac.createGain(); padG.gain.value = 0.02;
      pad.connect(padG).connect(master); pad.start(); stops.push(pad);
      master.gain.linearRampToValueAtTime(1, ac.currentTime + 3);
      (function note() {
        if (!ambient || ambientKind !== "qin") return;
        var t = ac.currentTime;
        var f0 = scale[Math.floor(Math.random() * scale.length)];
        [[f0, 0.045], [f0 * 2, 0.012], [f0 * 3, 0.004]].forEach(function (p) {
          var o = ac.createOscillator(); o.type = "sine"; o.frequency.value = p[0];
          var g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(p[1], t + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
          o.connect(g).connect(ac.destination);
          o.start(t); o.stop(t + 2.4);
        });
        timers.push(setTimeout(note, 1600 + Math.random() * 3200));
      })();
    }
    ambient = { g: master, stops: stops, timers: timers };
  }
  var soundBtn = document.getElementById("soundBtn"),
      soundKindBtn = document.getElementById("soundKind");
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "声 音 开" : "声 音 关";
    soundBtn.classList.toggle("on", soundOn);
    if (soundOn) { startAmbient(); chime(396); } else stopAmbient();
  });
  soundKindBtn.addEventListener("click", function () {
    ambientKind = KINDS[(KINDS.indexOf(ambientKind) + 1) % KINDS.length];
    soundKindBtn.textContent = "· " + KIND_NAMES[ambientKind] + " ·";
    if (!soundOn) {
      soundOn = true;
      soundBtn.textContent = "声 音 开";
      soundBtn.classList.add("on");
    }
    startAmbient();
  });

  /* ---------- 呼吸 ---------- */
  var orb = document.getElementById("orb"),
      breathLabel = document.getElementById("breathLabel"),
      breathCount = document.getElementById("breathCount"),
      breathBtn = document.getElementById("breathBtn"),
      cycleDoneEl = document.getElementById("cycleDone"),
      breathing = false, timer = null, ticker = null, cycles = 0;

  function setOrb(scale, secs) {
    orb.style.transition = "transform " + secs + "s cubic-bezier(.4,0,.4,1)";
    orb.style.transform = "scale(" + scale + ")";
  }
  function phase(name, secs, next, chimeFreq) {
    breathLabel.textContent = name;
    chime(chimeFreq);
    var left = secs;
    breathCount.textContent = left + " 秒";
    clearInterval(ticker);
    ticker = setInterval(function () {
      left--; breathCount.textContent = Math.max(left, 0) + " 秒";
    }, 1000);
    timer = setTimeout(function () { next(); }, secs * 1000);
  }
  function loop() {
    setOrb(1.18, 4);
    phase("吸 气", 4, function () {
      phase("停 住", 4, function () {
        setOrb(0.62, 6);
        phase("呼 气", 6, function () {
          phase("停 一 停", 2, function () {
            cycles++; cycleDoneEl.textContent = "已呼吸 " + cycles + " 轮";
            loop();
          }, 396);
        }, 528);
      });
    }, 528);
  }
  function startBreath() {
    breathing = true; breathBtn.textContent = "停 止"; breathBtn.classList.add("on");
    cycles = 0; cycleDoneEl.textContent = "";
    loop();
  }
  function stopBreath() {
    breathing = false; breathBtn.textContent = "开 始"; breathBtn.classList.remove("on");
    clearTimeout(timer); clearInterval(ticker);
    setOrb(0.62, 2); breathLabel.textContent = "准备好了吗"; breathCount.textContent = "";
  }
  breathBtn.addEventListener("click", function () { breathing ? stopBreath() : startBreath(); });
  stopBreath();

  /* ---------- 放下 ---------- */
  var putBtn = document.getElementById("putBtn"),
      worryText = document.getElementById("worryText"),
      putNote = document.getElementById("putNote"),
      putCount = 0;
  try { putCount = parseInt(localStorage.getItem("jingjiao.putdown") || "0", 10) || 0; } catch (e) {}

  putBtn.addEventListener("click", function () {
    var t = worryText.value.trim();
    if (!t) {
      putNote.textContent = "写点什么再放下，哪怕只有一个字";
      worryText.focus();
      return;
    }
    var short = t.length > 40 ? t.slice(0, 40) + "……" : t;
    var stamp = Date.now();
    /* 字从输入框飘落到沙滩 */
    var el = document.createElement("div");
    el.className = "drift serif";
    el.textContent = short;
    var r = worryText.getBoundingClientRect();
    var startX = r.left + Math.min(r.width * 0.25, 120);
    var startY = Math.max(80, r.top - 8);
    el.style.left = startX + "px";
    el.style.top = startY + "px";
    el.style.opacity = "0";
    document.body.appendChild(el);
    var b = beach.getBoundingClientRect();
    var tx = b.left + b.width * (0.18 + Math.random() * 0.5) - startX;
    var ty = b.top + b.height * (0.56 + Math.random() * 0.28) - startY;
    var rot = (Math.random() * 6 - 3).toFixed(1);
    function land() {
      el.remove();
      spawnSandWord(short, stamp,
        ((startX + tx - b.left) / b.width) * 100,
        ((startY + ty - b.top) / b.height) * 100,
        rot);
    }
    if (el.animate) {
      var drop = el.animate([
        { transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 0 },
        { transform: "translate(" + tx * 0.14 + "px,-44px) scale(.95) rotate(1.5deg)", opacity: .95, offset: .24 },
        { transform: "translate(" + tx * 0.58 + "px," + ty * 0.32 + "px) scale(.8) rotate(-1deg)", opacity: .9, offset: .58 },
        { transform: "translate(" + tx + "px," + ty + "px) scale(.62) rotate(" + rot + "deg)", opacity: .8 }
      ], { duration: 3400, easing: "cubic-bezier(.42,.08,.46,.94)" });
      drop.onfinish = land;
      setTimeout(function () { if (drop.playState !== "finished") drop.finish(); }, 3800);
    } else {
      el.style.transition = "transform 3.4s ease-in-out, opacity 1.2s";
      requestAnimationFrame(function () {
        el.style.transform = "translate(" + tx + "px," + ty + "px) scale(.62)";
        el.style.opacity = ".8";
      });
      setTimeout(land, 3500);
    }
    worryText.value = "";
    putCount++;
    try { localStorage.setItem("jingjiao.putdown", String(putCount)); } catch (e) {}
    worries.push({ t: t.length > 500 ? t.slice(0, 500) : t, d: stamp });
    if (worries.length > 300) worries = worries.slice(worries.length - 300);
    saveWorries();
    chime(345);
    var msgs = [
      "它落在了沙滩上，浪会替你慢慢抚平",
      "你已经看过它一眼了，这就够了",
      "一个小时后，沙上就平了——时间站在你这边",
      "夜还长，事不急"
    ];
    putNote.style.opacity = 0;
    setTimeout(function () {
      putNote.textContent = msgs[putCount % msgs.length] + " · 这是你在静角放下的第 " + putCount + " 件事";
      putNote.style.opacity = 1;
    }, 500);
  });
  worryText.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) putBtn.click();
  });

  /* ---------- 往事 ---------- */
  var pastBtn = document.getElementById("pastBtn"),
      pastVeil = document.getElementById("pastVeil"),
      pastList = document.getElementById("pastList"),
      pastClose = document.getElementById("pastClose"),
      worries = [];
  try { worries = JSON.parse(localStorage.getItem("jingjiao.worries") || "[]") || []; } catch (e) {}
  function saveWorries() {
    try { localStorage.setItem("jingjiao.worries", JSON.stringify(worries)); } catch (e) {}
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(ts) {
    var d = Math.floor((Date.now() - ts) / 86400000);
    if (d <= 0) return "今天";
    if (d === 1) return "昨天";
    if (d < 30) return d + " 天前";
    if (d < 365) return Math.floor(d / 30) + " 个月前";
    return Math.floor(d / 365) + " 年前";
  }
  function fmtDate(ts) {
    var dt = new Date(ts);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return dt.getFullYear() + " 年 " + (dt.getMonth() + 1) + " 月 " + dt.getDate() + " 日 " + p(dt.getHours()) + ":" + p(dt.getMinutes());
  }
  function renderPast() {
    if (!worries.length) {
      pastList.innerHTML = '<p class="past-empty">这里还空着。<br>第一件要放下的事，随时可以来。</p>';
      return;
    }
    var html = "";
    for (var i = worries.length - 1; i >= 0; i--) {
      html += '<div class="past-item"><div class="past-date">' + fmtDate(worries[i].d) + " · " + ago(worries[i].d) + '</div><div class="past-text">' + escapeHtml(worries[i].t) + '</div></div>';
    }
    pastList.innerHTML = html;
  }
  pastBtn.addEventListener("click", function () {
    renderPast();
    pastVeil.classList.add("show");
  });
  pastClose.addEventListener("click", function () { pastVeil.classList.remove("show"); });
  pastVeil.addEventListener("click", function (e) {
    if (e.target === pastVeil) pastVeil.classList.remove("show");
  });

  /* ---------- 记忆沙滩 ---------- */
  var beach = document.getElementById("beach"),
      beachWritings = document.getElementById("beachWritings"),
      BEACH_MS = 3600000; /* 一小时，浪把字彻底抚平 */
  function hash01(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function applyErosion(el, d) {
    var e = Math.min(1, Math.max(0, (Date.now() - d) / BEACH_MS));
    el.style.opacity = ((1 - e) * 0.6 + 0.03).toFixed(3);
    el.style.filter = "blur(" + (e * 5).toFixed(2) + "px)";
    el.style.transform = "rotate(var(--rot,0deg)) translateY(" + (e * 8).toFixed(1) + "px)";
    return e;
  }
  function makeSandWord(shortText, d, xPct, yPct, rot) {
    var el = document.createElement("div");
    el.className = "sand-word serif";
    el.textContent = shortText;
    el.dataset.d = String(d);
    el.style.left = xPct.toFixed(1) + "%";
    el.style.top = yPct.toFixed(1) + "%";
    el.style.setProperty("--rot", (rot || 0) + "deg");
    return el;
  }
  function spawnSandWord(shortText, d, xPct, yPct, rot) {
    var el = makeSandWord(shortText, d, xPct, yPct, rot);
    el.style.opacity = "0";
    el.style.filter = "blur(1px)";
    el.style.transform = "rotate(var(--rot,0deg)) translateY(-6px) scale(1.12)";
    beachWritings.appendChild(el);
    /* 落定：像字迹轻轻压进沙里 */
    setTimeout(function () { applyErosion(el, d); }, 60);
  }
  function renderBeach() {
    if (!beachWritings) return;
    beachWritings.innerHTML = "";
    worries.forEach(function (w) {
      if (Date.now() - w.d >= BEACH_MS) return;
      var h1 = hash01(w.d), h2 = hash01(w.d + 1), h3 = hash01(w.d + 2);
      var el = makeSandWord(w.t.length > 40 ? w.t.slice(0, 40) + "……" : w.t, w.d,
        12 + h1 * 44, 54 + h2 * 26, (h3 * 8 - 4).toFixed(1));
      applyErosion(el, w.d);
      beachWritings.appendChild(el);
    });
  }
  /* 每 30 秒让浪再抚一遍：字随真实时间变淡、变模糊、微微下沉 */
  setInterval(function () {
    if (!sections.put.classList.contains("show")) return;
    var kids = beachWritings.children;
    for (var i = kids.length - 1; i >= 0; i--) {
      var el = kids[i];
      if (el.classList.contains("demo")) continue;
      var e = applyErosion(el, parseInt(el.dataset.d, 10));
      if (e >= 1 && !el.dataset.gone) {
        el.dataset.gone = "1";
        setTimeout(function (x) { return function () { x.remove(); }; }(el), 3200);
      }
    }
  }, 30000);
  /* 长按沙滩：12 秒看完浪抚平一小时的字迹 */
  var pressTimer = null, demoing = false, pressX = 0, pressY = 0;
  beach.addEventListener("pointerdown", function (e) {
    clearTimeout(pressTimer);
    pressX = e.clientX; pressY = e.clientY;
    pressTimer = setTimeout(startBeachDemo, 650);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
    beach.addEventListener(ev, function () { clearTimeout(pressTimer); }, { passive: true });
  });
  beach.addEventListener("pointermove", function (e) {
    if (Math.abs(e.clientX - pressX) > 12 || Math.abs(e.clientY - pressY) > 12) clearTimeout(pressTimer);
  }, { passive: true });
  function startBeachDemo() {
    if (demoing) return;
    demoing = true;
    beach.classList.add("surge");
    var text = worries.length ? worries[worries.length - 1].t : "一件小小的心事";
    if (text.length > 22) text = text.slice(0, 22) + "……";
    var el = document.createElement("div");
    el.className = "sand-word demo serif";
    el.textContent = text;
    el.style.left = "34%";
    el.style.top = "64%";
    el.style.opacity = ".7";
    beachWritings.appendChild(el);
    var t0 = Date.now(), DUR = 12000;
    var iv = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / DUR);
      el.style.opacity = ((1 - p) * 0.68 + 0.02).toFixed(3);
      el.style.filter = "blur(" + (p * 6).toFixed(2) + "px)";
      el.style.transform = "translateY(" + (p * 11).toFixed(1) + "px)";
      if (p >= 1) {
        clearInterval(iv);
        setTimeout(function () {
          el.remove();
          beach.classList.remove("surge");
          demoing = false;
        }, 900);
      }
    }, 120);
  }
  renderBeach();

  /* ---------- 静坐 ---------- */
  var sitTime = document.getElementById("sitTime"),
      sitMsg = document.getElementById("sitMsg"),
      sitStart = document.getElementById("sitStart"),
      sitMins = 5, sitTimer = null, sitting = false;

  Array.prototype.forEach.call(document.querySelectorAll("[data-min]"), function (b) {
    b.addEventListener("click", function () {
      if (sitting) return;
      sitMins = parseInt(b.dataset.min, 10);
      sitTime.innerHTML = sitMins + "<small> 分钟</small>";
    });
  });
  function fmt(s) {
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  function resetSit() {
    sitting = false; clearInterval(sitTimer);
    sitTime.innerHTML = sitMins + "<small> 分钟</small>";
    sitMsg.classList.remove("show");
    sitStart.textContent = "开 始";
  }
  sitStart.addEventListener("click", function () {
    if (sitting) { resetSit(); return; }
    sitting = true; sitStart.textContent = "结 束";
    var left = sitMins * 60;
    sitTime.textContent = fmt(left);
    sitMsg.textContent = "";
    chime(528);
    sitTimer = setInterval(function () {
      left--;
      sitTime.textContent = fmt(Math.max(left, 0));
      if (left <= 0) {
        clearInterval(sitTimer); sitting = false;
        chime(528); setTimeout(function () { chime(396); }, 900);
        sitTime.innerHTML = sitMins + "<small> 分钟</small>";
        sitMsg.textContent = "好了，回去吧。";
        sitMsg.classList.add("show");
        sitStart.textContent = "开 始";
      }
    }, 1000);
  });
})();
</script>
</body>
</html>
